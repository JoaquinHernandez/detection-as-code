cat << 'EOF' > rules/persistence_cron_modification.yml
title: Unauthorized Linux Cron Table Modification
id: 4a259c63-6bbf-41f2-8921-bf2be3a58cf0
status: production
description: Detects process executions modifying scheduled tasks in /etc/cron* or user crontabs indicative of persistence mechanisms.
references:
    - https://attack.mitre.org/techniques/T1053/003/
author: Detection Engineering Team
date: 2026-10-31
tags:
    - attack.persistence
    - attack.t1053.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_exec:
        Image|endswith:
            - '/crontab'
            - '/tee'
        CommandLine|contains:
            - '/etc/cron'
            - '/var/spool/cron'
    selection_redirection:
        CommandLine|contains:
            - '>> /etc/crontab'
            - '>> /etc/cron.d/'
            - '>> /var/spool/cron/crontabs/'
    filter_ansible:
        CommandLine|contains:
            - 'ansible-tmp'
            - 'management-automation-user'
    condition: (selection_exec or selection_redirection) and not filter_ansible
falsepositives:
    - Verified configuration management tools (Puppet, Salt, Chef, Ansible) operating from designated service accounts.
level: high
EOF
